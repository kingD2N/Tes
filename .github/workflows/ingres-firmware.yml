name: Ingres Firmware (LineageOS 24)

# Ambil image firmware (abl, xbl, modem, dsp, dll.) dari OTA full HyperOS
# resmi ingres, lalu terbitkan sebagai GitHub Release di repo ini.
# Image-nya dipakai untuk vendor/xiaomi/ingres (radio/) di LineageOS 24.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi HyperOS ingres"
        default: "OS2.0.8.0.ULJCNXM"
      zip_name:
        description: "Nama file OTA full (recovery ROM)"
        default: "ingres-ota_full-OS2.0.8.0.ULJCNXM-user-14.0-e181db717d.zip"
      md5:
        description: "MD5 OTA full (kosongkan untuk lewati cek)"
        default: "e181db717dc1bc3f437e46d7e701a7c3"
  push:
    branches: [main]
    paths: [".github/workflows/ingres-firmware.yml"]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || 'OS2.0.8.0.ULJCNXM' }}
      ZIP_NAME: ${{ inputs.zip_name || 'ingres-ota_full-OS2.0.8.0.ULJCNXM-user-14.0-e181db717d.zip' }}
      ZIP_MD5: ${{ inputs.md5 || 'e181db717dc1bc3f437e46d7e701a7c3' }}
      PARTITIONS: abl,aop,aop_config,bluetooth,cpucp,devcfg,dsp,featenabler,hyp,imagefv,keymaster,modem,qupfw,shrm,tz,uefi,uefisecapp,xbl,xbl_config,xbl_ramdump
      PDG_VERSION: "1.3.0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Download OTA full
        timeout-minutes: 120
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2 >/dev/null
          mkdir -p work && cd work
          HOSTS="cdn-ota.azureedge.net bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com bn.d.miui.com cdnorg.d.miui.com bigota.d.miui.com hugeota.d.miui.com"
          # Cek dulu mirror mana yang menyediakan file (status + ukuran)
          good=""
          for host in $HOSTS; do
            url="https://${host}/${VERSION}/${ZIP_NAME}"
            info=$(curl -sIL --max-time 20 "$url" | tr -d '\r' | awk 'tolower($1)=="content-length:"{l=$2} /^HTTP\//{c=$2} END{print c, l}')
            echo "probe ${host}: ${info:-tidak ada respon}"
            case "$info" in 200\ [0-9]*) good="$good $host" ;; esac
          done
          [ -n "$good" ] || { echo "::error::Tidak ada mirror yang menyediakan ${ZIP_NAME}"; exit 1; }
          ok=""
          for host in $good; do
            url="https://${host}/${VERSION}/${ZIP_NAME}"
            echo "==> unduh dari ${url}"
            rm -f ota.zip ota.zip.aria2
            # mirror lambat/macet ditinggal: batas 35 menit & minimal 1 MB/s
            if timeout 35m aria2c -x16 -s16 -k4M --file-allocation=none \
                 --connect-timeout=30 --timeout=60 --max-tries=5 --retry-wait=5 \
                 --lowest-speed-limit=1M --summary-interval=60 --console-log-level=warn \
                 --download-result=hide -o ota.zip "$url"; then
              if [ -z "$ZIP_MD5" ] || echo "${ZIP_MD5}  ota.zip" | md5sum -c -; then
                ok="$url"; break
              fi
              echo "::warning::MD5 tidak cocok dari ${host}"
            else
              echo "::warning::Unduhan dari ${host} gagal/terlalu lambat, pindah mirror"
            fi
          done
          [ -n "$ok" ] || { echo "::error::OTA ${ZIP_NAME} tidak bisa diunduh dari semua mirror"; exit 1; }
          echo "OTA_URL=$ok" >> "$GITHUB_ENV"
          ls -lh ota.zip

      - name: Extract payload.bin
        working-directory: work
        run: |
          unzip -o -q ota.zip payload.bin
          rm -f ota.zip
          ls -lh payload.bin

      - name: Extract firmware images
        working-directory: work
        run: |
          curl -fsSL -o pdg.tgz "https://github.com/ssut/payload-dumper-go/releases/download/${PDG_VERSION}/payload-dumper-go_${PDG_VERSION}_linux_amd64.tar.gz"
          tar xzf pdg.tgz payload-dumper-go
          ./payload-dumper-go -l payload.bin | tee partitions.txt
          missing=""
          for p in ${PARTITIONS//,/ }; do grep -qw "$p" partitions.txt || missing="$missing $p"; done
          [ -z "$missing" ] || { echo "::error::Partisi tidak ada di payload:$missing"; exit 1; }
          ./payload-dumper-go -c 4 -p "$PARTITIONS" -o out payload.bin
          rm -f payload.bin
          cd out
          sha256sum *.img > SHA256SUMS
          sha1sum *.img > SHA1SUMS
          ls -l *.img | awk '{printf "%-20s %12d\n", $9, $5}' | tee SIZES
          for f in *.img; do
            s=$(stat -c%s "$f")
            [ "$s" -lt 104857600 ] || echo "::warning::$f ${s} byte (>100 MB, tidak bisa masuk git biasa)"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: work/out
        run: |
          TAG="ingres-firmware-${VERSION}"
          {
            echo "Firmware POCO F4 GT / Redmi K50 Gaming (ingres) dari HyperOS ${VERSION}."
            echo
            echo "Sumber: ${OTA_URL}"
            echo
            echo '```'
            cat SIZES
            echo '```'
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" *.img SHA256SUMS SHA1SUMS SIZES --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" *.img SHA256SUMS SHA1SUMS SIZES \
              --repo "$GITHUB_REPOSITORY" --title "ingres firmware ${VERSION}" --notes-file notes.md
          fi

name: Ingres Vendor Blobs (LineageOS 24)

# Ekstrak ulang vendor/xiaomi/ingres (blob + firmware) dari OTA full HyperOS
# resmi ingres memakai extract-utils LineageOS 24 dan device tree
# kingD2N/android_device_xiaomi_ingres-old (lineage-24.0).
# Hasilnya: git bundle berisi commit baru di atas vendor lineage-24.0,
# diterbitkan sebagai release di repo ini.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi HyperOS ingres"
        default: "OS2.0.8.0.ULJCNXM"
      zip_name:
        description: "Nama file OTA full (recovery ROM)"
        default: "ingres-ota_full-OS2.0.8.0.ULJCNXM-user-14.0-e181db717d.zip"
      md5:
        description: "MD5 OTA full (kosongkan untuk lewati cek)"
        default: "e181db717dc1bc3f437e46d7e701a7c3"
  push:
    branches: [main]
    paths: [".github/workflows/ingres-vendor.yml"]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      VERSION: ${{ inputs.version || 'OS2.0.8.0.ULJCNXM' }}
      ZIP_NAME: ${{ inputs.zip_name || 'ingres-ota_full-OS2.0.8.0.ULJCNXM-user-14.0-e181db717d.zip' }}
      ZIP_MD5: ${{ inputs.md5 || 'e181db717dc1bc3f437e46d7e701a7c3' }}
      BRANCH: lineage-24.0
      ROOT: ${{ github.workspace }}/root
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 erofs-utils e2fsprogs llvm zstd unzip >/dev/null
          pip3 install --break-system-packages -q py7zr || pip3 install -q py7zr

      - name: Download OTA full
        timeout-minutes: 120
        run: |
          mkdir -p "$ROOT" && cd "$ROOT"
          HOSTS="cdn-ota.azureedge.net bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com bn.d.miui.com cdnorg.d.miui.com bigota.d.miui.com hugeota.d.miui.com"
          good=""
          for host in $HOSTS; do
            url="https://${host}/${VERSION}/${ZIP_NAME}"
            info=$(curl -sIL --max-time 20 "$url" | tr -d '\r' | awk 'tolower($1)=="content-length:"{l=$2} /^HTTP\//{c=$2} END{print c, l}')
            echo "probe ${host}: ${info:-tidak ada respon}"
            case "$info" in 200\ [0-9]*) good="$good $host" ;; esac
          done
          [ -n "$good" ] || { echo "::error::Tidak ada mirror yang menyediakan ${ZIP_NAME}"; exit 1; }
          ok=""
          for host in $good; do
            url="https://${host}/${VERSION}/${ZIP_NAME}"
            echo "==> unduh dari ${url}"
            rm -f ota.zip ota.zip.aria2
            if timeout 35m aria2c -x16 -s16 -k4M --file-allocation=none \
                 --connect-timeout=30 --timeout=60 --max-tries=5 --retry-wait=5 \
                 --lowest-speed-limit=1M --summary-interval=60 --console-log-level=warn \
                 --download-result=hide -o ota.zip "$url"; then
              if [ -z "$ZIP_MD5" ] || echo "${ZIP_MD5}  ota.zip" | md5sum -c -; then
                ok="$url"; break
              fi
              echo "::warning::MD5 tidak cocok dari ${host}"
            else
              echo "::warning::Unduhan dari ${host} gagal/terlalu lambat, pindah mirror"
            fi
          done
          [ -n "$ok" ] || { echo "::error::OTA ${ZIP_NAME} tidak bisa diunduh dari semua mirror"; exit 1; }
          echo "OTA_URL=$ok" >> "$GITHUB_ENV"
          unzip -p ota.zip META-INF/com/android/metadata | tee metadata.txt

      - name: Set up source tree
        run: |
          cd "$ROOT"
          clone() { git clone -q --depth 1 -b "$2" "https://github.com/$1" "$3"; echo "$3: $(git -C "$3" log -1 --format='%h %s')"; }
          clone LineageOS/android_tools_extract-utils lineage-24.0 tools/extract-utils
          clone LineageOS/android_prebuilts_extract-tools lineage-24.0 prebuilts/extract-tools
          clone kingD2N/android_device_xiaomi_ingres-old "$BRANCH" device/xiaomi/ingres
          clone kingD2N/Ingres_device_xiaomi_sm8450-common "$BRANCH" device/xiaomi/sm8450-common
          clone kingD2N/proprietary_vendor_xiaomi_ingres "$BRANCH" vendor/xiaomi/ingres
          mkdir -p prebuilts/clang/host/linux-x86/llvm-binutils-stable
          for t in llvm-objdump llvm-strip; do
            ln -sf "$(command -v $t || ls /usr/lib/llvm-*/bin/$t | tail -n1)" prebuilts/clang/host/linux-x86/llvm-binutils-stable/$t
          done
          df -h /

      - name: Extract blobs and firmware
        run: |
          cd "$ROOT"
          V=vendor/xiaomi/ingres
          # modem/ (modem.img dipecah) bukan hasil extract-utils, simpan dulu
          mkdir -p keep && cp -a $V/modem $V/README.md keep/ 2>/dev/null || true
          cd device/xiaomi/ingres
          chmod +x extract-files.py
          set +e +o pipefail
          ./extract-files.py --only-target "$ROOT/ota.zip" 2>&1 | tee "$ROOT/extract.log"
          rc=${PIPESTATUS[0]}
          echo "EXTRACT_RC=$rc" >> "$GITHUB_ENV"
          set -e
          [ "$rc" -eq 0 ] || echo "::error::extract-files.py gagal (rc=$rc), lihat extract.log di release"
          cd "$ROOT"
          cp -a keep/. $V/
          rm -f ota.zip

      - name: Commit and bundle
        if: env.EXTRACT_RC == '0'
        run: |
          cd "$ROOT/vendor/xiaomi/ingres"
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short > "$ROOT/changes.txt"
          echo "file berubah: $(wc -l < "$ROOT/changes.txt")"
          git diff --cached --stat | tail -n 5
          git commit -q -m "ingres: Update blobs and firmware from ${VERSION}" || { echo "::warning::Tidak ada perubahan"; }
          git log --oneline -2
          git bundle create "$ROOT/vendor-ingres-${VERSION}.bundle" "origin/${BRANCH}..HEAD" || true
          ls -lh "$ROOT"/*.bundle 2>/dev/null || true

      - name: Publish release
        if: always() && env.OTA_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$ROOT"
          TAG="ingres-vendor-${VERSION}"
          files="metadata.txt"
          for f in extract.log changes.txt; do [ -f "$f" ] && files="$files $f"; done
          ls vendor-ingres-*.bundle >/dev/null 2>&1 && files="$files vendor-ingres-${VERSION}.bundle"
          printf 'Vendor ingres (blob + firmware) dari HyperOS %s.\n\nSumber: %s\n' "$VERSION" "$OTA_URL" > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $files --repo "$GITHUB_REPOSITORY" \
              --title "ingres vendor ${VERSION}" --notes-file notes.md
          fi

      - name: Check result
        if: always()
        run: |
          [ "${EXTRACT_RC:-1}" = "0" ] || { echo "::error::Ekstraksi gagal (rc=${EXTRACT_RC:-?})"; exit 1; }

# Build AxionOS (LineageOS 23.2-based) for Xiaomi POCO F4 GT / Redmi K50G (ingres, SM8450)
#
# Requires a SELF-HOSTED runner labeled `rom-builder` (persistent disk, not
# GitHub-hosted - a full AOSP/AxionOS tree + out/ + ccache needs ~250-400GB):
#   - repo/git-lfs get auto-installed below if missing
#   - 64GB+ RAM (or equivalent swap) recommended - not configured here, since
#     that's a host-level concern on a dedicated self-hosted rig, not a
#     per-job CI step
#
# Source lives OUTSIDE $GITHUB_WORKSPACE at $HOME/rom-src/axion-<device>, so:
#   - it survives across runs regardless of actions/checkout's clean/reset
#     behavior on $GITHUB_WORKSPACE
#   - `repo sync` stays incremental instead of re-fetching everything each run
#
# Adapted from the Melt kernel CI (build.yml) conventions + the ingres
# roomservice recipe (nganu.txt): same GH Release / ccache / release-notes
# style, pointed at a full ROM sync+build pipeline instead of a standalone
# kernel compile.

name: Build AxionOS ROM - POCO F4 GT (Ingres)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device codename"
        required: true
        type: string
        default: "ingres"

      soc:
        description: "SoC/platform codename (dipakai untuk path kernel & device-common tree)"
        required: true
        type: string
        default: "sm8450"

      manifest_branch:
        description: "Branch manifest AxionOS (AxionAOSP/android) - juga dipakai sebagai basis reset untuk hardware/lineage/interfaces & device/lineage/sepolicy sebelum cherry-pick"
        required: true
        type: string
        default: "lineage-23.2"

      device_branch:
        description: "Branch untuk device/vendor/kernel tree ingres (Ingres-Centre & Gurinbone)"
        required: true
        type: string
        default: "lineage-23.2"

      packages_branch:
        description: "Branch untuk packages GameKeys & Leds (Ingres-Centre) - beda dari device_branch, defaultnya lineage-23.0"
        required: true
        type: string
        default: "lineage-23.0"

      hardware_branch:
        description: "Branch untuk hardware/xiaomi (LineageOS)"
        required: true
        type: string
        default: "lineage-23.2"

      include_miuicamera:
        description: "Sertakan MIUI Camera HAL (device+vendor miuicamera-<device>, Gurinbone)"
        required: true
        type: boolean
        default: true

      include_dolby:
        description: "Sertakan Dolby (hardware_dolby + packages_apps_DolbyUI, Gurinbone)"
        required: true
        type: boolean
        default: true

      dolby_hw_branch:
        description: "Branch hardware_dolby"
        required: false
        type: string
        default: "Dolby-Vision-2.1"

      dolby_ui_branch:
        description: "Branch packages_apps_DolbyUI"
        required: false
        type: string
        default: "16.0"

      ksu_type:
        description: "Root solution yang di-setup ke kernel in-tree (kernel/xiaomi/<soc>)"
        required: true
        type: choice
        default: "KernelSU-Next"
        options:
          - None
          - Official-KernelSU
          - KernelSU-Next
          - KowSU
          - ReSukiSU
          - SukiSUUltra

      build_type:
        description: "Build type (axion <device> <build_type> <gms_variant>)"
        required: true
        type: choice
        default: "userdebug"
        options:
          - user
          - userdebug
          - eng

      gms_variant:
        description: "GMS variant (axion <device> <build_type> <gms_variant>)"
        required: true
        type: choice
        default: "gms"
        options:
          - gms
          - pico
          - core
          - full
          - va

      sync_source:
        description: "Jalankan repo init/sync + sync tree device-specific. Matikan untuk rebuild cepat dari source yang sudah ada (butuh sync sukses minimal sekali sebelumnya)"
        required: true
        type: boolean
        default: true

      clean_build:
        description: "Paksa clean build (mka clobber sebelum axion/ax) - ccache tetap dipakai"
        required: true
        type: boolean
        default: false

      regen_keys:
        description: "Paksa generate ulang signing keys (gk -s) walau vendor/lineage-priv/keys sudah ada - HATI-HATI: mengganti keys memutus kontinuitas update OTA dari build sebelumnya"
        required: true
        type: boolean
        default: false

      ccache_update:
        description: "Hapus ccache lama sebelum build (fresh cache)"
        required: true
        type: boolean
        default: false

      ccache_size:
        description: "Ukuran maksimum ccache"
        required: true
        type: string
        default: "75G"

      job_count:
        description: "Override jumlah thread untuk 'ax -br -j'. Kosongkan untuk pakai nproc otomatis"
        required: false
        type: string
        default: ""

jobs:
  Build_ROM:
    runs-on: [self-hosted, rom-builder]
    timeout-minutes: 1440
    concurrency:
      group: axionos-${{ inputs.device }}-build
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      DEVICE: ${{ inputs.device }}
      SOC: ${{ inputs.soc }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare persistent ROM workspace
        run: |
          ROM_DIR="$HOME/rom-src/axion-${DEVICE}"
          mkdir -p "$ROM_DIR" "$HOME/bin"
          echo "ROM_DIR=$ROM_DIR" >> "$GITHUB_ENV"
          echo "BUILD_LOG=$HOME/axion-${DEVICE}-build.log" >> "$GITHUB_ENV"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "==> Persistent source tree: $ROM_DIR"
          df -h "$HOME"

      - name: Install repo tool & build dependencies
        run: |
          if ! command -v repo >/dev/null 2>&1; then
            curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
            chmod a+x "$HOME/bin/repo"
          fi
          repo --version

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl erofs-utils flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev libdw-dev libelf-dev libgnutls28-dev \
            lz4 libsdl1.2-dev libssl-dev libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc xxd zip unzip zlib1g-dev \
            python3 python-is-python3 protobuf-compiler python3-protobuf fontconfig

          git lfs install --skip-repo

      - name: Init & sync AxionOS manifest (${{ inputs.manifest_branch }})
        if: ${{ inputs.sync_source }}
        working-directory: ${{ env.ROM_DIR }}
        run: |
          set -e
          repo init -u https://github.com/AxionAOSP/android.git -b "${{ inputs.manifest_branch }}" --git-lfs
          repo sync -c -f --force-sync --no-tags --no-clone-bundle -j"$(nproc)" --optimized-fetch --prune

      - name: Sync device/vendor/kernel trees (Ingres-Centre & Gurinbone)
        if: ${{ inputs.sync_source }}
        working-directory: ${{ env.ROM_DIR }}
        run: |
          set -e

          sync_repo() {
            local url="$1" branch="$2" path="$3"
            if [ -d "$path/.git" ]; then
              echo "==> Update: $path (@ $branch)"
              git -C "$path" remote set-url origin "$url"
              git -C "$path" fetch origin "$branch" --depth=1
              git -C "$path" checkout -B "$branch" "origin/$branch"
              git -C "$path" reset --hard "origin/$branch"
              git -C "$path" clean -ffdx
            else
              echo "==> Clone: $path (@ $branch)"
              rm -rf "$path"
              git clone --depth=1 -b "$branch" "$url" "$path"
            fi
          }

          D="${{ inputs.device_branch }}"
          P="${{ inputs.packages_branch }}"
          H="${{ inputs.hardware_branch }}"

          sync_repo "https://github.com/Ingres-Centre/android_device_xiaomi_${DEVICE}"         "$D" "device/xiaomi/${DEVICE}"
          sync_repo "https://github.com/Gurinbone/android_device_xiaomi_${SOC}-common"         "$D" "device/xiaomi/${SOC}-common"
          sync_repo "https://github.com/Gurinbone/proprietary_vendor_xiaomi_${DEVICE}"         "$D" "vendor/xiaomi/${DEVICE}"
          sync_repo "https://github.com/Gurinbone/proprietary_vendor_xiaomi_${SOC}-common"     "$D" "vendor/xiaomi/${SOC}-common"
          sync_repo "https://github.com/Ingres-Centre/android_kernel_xiaomi_${SOC}"            "$D" "kernel/xiaomi/${SOC}"
          sync_repo "https://github.com/LineageOS/android_kernel_xiaomi_${SOC}-modules"        "$D" "kernel/xiaomi/${SOC}-modules"
          sync_repo "https://github.com/Ingres-Centre/android_kernel_xiaomi_${SOC}-devicetrees" "$D" "kernel/xiaomi/${SOC}-devicetrees"
          sync_repo "https://github.com/Ingres-Centre/android_packages_apps_gamekeys"          "$P" "packages/apps/GameKeys"
          sync_repo "https://github.com/Ingres-Centre/android_packages_apps_leds"              "$P" "packages/apps/Leds"
          sync_repo "https://github.com/LineageOS/android_hardware_xiaomi"                     "$H" "hardware/xiaomi"

          if [[ "${{ inputs.include_miuicamera }}" == true ]]; then
            sync_repo "https://github.com/Gurinbone/android_device_xiaomi_miuicamera-${DEVICE}" "$D" "device/xiaomi/miuicamera-${DEVICE}"
            sync_repo "https://github.com/Gurinbone/android_vendor_xiaomi_miuicamera-${DEVICE}" "$D" "vendor/xiaomi/miuicamera-${DEVICE}"
          fi

          if [[ "${{ inputs.include_dolby }}" == true ]]; then
            sync_repo "https://github.com/Gurinbone/hardware_dolby"        "${{ inputs.dolby_hw_branch }}" "hardware/dolby"
            sync_repo "https://github.com/Gurinbone/packages_apps_DolbyUI" "${{ inputs.dolby_ui_branch }}" "packages/apps/DolbyUI"
          fi

      - name: Terapkan commit GameKeys & Leds (hardware/lineage/interfaces)
        working-directory: ${{ env.ROM_DIR }}/hardware/lineage/interfaces
        run: |
          set -e
          git fetch origin "${{ inputs.manifest_branch }}"
          git reset --hard "origin/${{ inputs.manifest_branch }}"
          git remote remove ingres 2>/dev/null || true
          git remote add ingres https://github.com/Ingres-Centre/android_hardware_lineage_interfaces.git
          git fetch ingres

          for c in fed24686e662735bcb2a5028889ce1fd51980d2c \
                   cf431b188a7aa143b99f46e7522a295a3cb04d66 \
                   fa0664db2da556267cb4400008d5f2f0db9091c7; do
            if ! git cherry-pick -X theirs "$c"; then
              echo "::error::Cherry-pick $c gagal di hardware/lineage/interfaces - cek konflik manual (kemungkinan tree lineage-23.2 sudah berubah dari basis komit ini)."
              git cherry-pick --abort
              exit 1
            fi
          done

      - name: Terapkan commit GameKeys & Leds (device/lineage/sepolicy)
        working-directory: ${{ env.ROM_DIR }}/device/lineage/sepolicy
        run: |
          set -e
          git fetch origin "${{ inputs.manifest_branch }}"
          git reset --hard "origin/${{ inputs.manifest_branch }}"
          git remote remove ingres 2>/dev/null || true
          git remote add ingres https://github.com/Ingres-Centre/android_device_lineage_sepolicy.git
          git fetch ingres

          for c in 48c5dc61da2bdee3e2cac31a707edf14174a1a2f \
                   9319664761f6c0fb3c822dbb12350287ade8fe77 \
                   864a5bc08a805ea412ea4221b4f915bc0c9d109c; do
            if ! git cherry-pick -X theirs "$c"; then
              echo "::error::Cherry-pick $c gagal di device/lineage/sepolicy - cek konflik manual (kemungkinan tree lineage-23.2 sudah berubah dari basis komit ini)."
              git cherry-pick --abort
              exit 1
            fi
          done

      - name: Integrasi root solution ke kernel in-tree (${{ inputs.ksu_type }})
        if: ${{ inputs.ksu_type != 'None' }}
        working-directory: ${{ env.ROM_DIR }}/kernel/xiaomi/${{ env.SOC }}
        run: |
          set -e
          case "${{ inputs.ksu_type }}" in
            "Official-KernelSU")
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
              ;;
            "KowSU")
              curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/main/kernel/setup.sh" | bash -s master
              ;;
            "KernelSU-Next")
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev
              ;;
            "ReSukiSU")
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
              ;;
            "SukiSUUltra")
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
              ;;
          esac

      - name: Build AxionOS ROM
        working-directory: ${{ env.ROM_DIR }}
        run: |
          set -e
          date +%s > .ci_build_marker

          if [[ "${{ inputs.ccache_update }}" == true ]]; then
            echo "==> Membersihkan ccache lama..."
            rm -rf "$HOME/.ccache-axion-${DEVICE}"
          fi

          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"
          export CCACHE_DIR="$HOME/.ccache-axion-${DEVICE}"
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${ROM_DIR}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          mkdir -p "$CCACHE_DIR"
          SLOPPINESS_LINE="sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros"
          grep -qxF "$SLOPPINESS_LINE" "${CCACHE_DIR}/ccache.conf" 2>/dev/null || echo "$SLOPPINESS_LINE" >> "${CCACHE_DIR}/ccache.conf"
          ccache -M "${{ inputs.ccache_size }}"
          ccache -o compression=true
          echo "ccache status sebelum build:"
          ccache -s

          source build/envsetup.sh

          KEY_DIR="vendor/lineage-priv/keys"
          if [[ "${{ inputs.regen_keys }}" == true ]] || [ ! -d "$KEY_DIR" ] || [ -z "$(ls -A "$KEY_DIR" 2>/dev/null)" ]; then
            echo "==> Generating signing keys ($KEY_DIR)"
            gk -s
          else
            echo "==> Signing keys sudah ada di $KEY_DIR, dipertahankan (set regen_keys: true untuk generate ulang)"
          fi

          if [[ "${{ inputs.clean_build }}" == true ]]; then
            echo "==> clean_build aktif - menjalankan mka clobber"
            mka clobber || rm -rf out
          fi

          axion "${DEVICE}" "${{ inputs.build_type }}" "${{ inputs.gms_variant }}"

          JOBS="${{ inputs.job_count }}"
          [[ -z "$JOBS" ]] && JOBS="$(nproc)"
          echo "==> Building dengan -j${JOBS}"

          set +e
          ax -br -j"${JOBS}" 2>&1 | tee "$BUILD_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          echo "ccache status setelah build:"
          ccache -s

          exit "$BUILD_STATUS"

      - name: Cari output ROM hasil build
        id: locate
        if: always()
        working-directory: ${{ env.ROM_DIR }}
        run: |
          OUT_DIR="out/target/product/${DEVICE}"
          if [ ! -d "$OUT_DIR" ]; then
            echo "::error::Direktori output $OUT_DIR tidak ditemukan - build kemungkinan gagal sebelum tahap packaging."
            exit 1
          fi

          ROM_ZIP=$(find "$OUT_DIR" -maxdepth 1 -type f -iname "*.zip" -newer ".ci_build_marker" \
                      ! -iname "*target_files*" ! -iname "*ota*" ! -iname "*super_empty*" \
                      | sort | head -n1)

          if [ -z "$ROM_ZIP" ]; then
            echo "::error::Tidak ada file .zip baru ditemukan di $OUT_DIR - build kemungkinan gagal sebelum 'ax -br' selesai membungkus ROM."
            echo "Isi $OUT_DIR (6 file terbaru):"
            ls -lt "$OUT_DIR" | head -n 6 || true
            exit 1
          fi

          echo "==> ROM zip ditemukan: $ROM_ZIP"
          ROM_SHA256=$(sha256sum "$ROM_ZIP" | awk '{print $1}')

          {
            echo "rom_zip=$ROM_ZIP"
            echo "rom_zip_name=$(basename "$ROM_ZIP")"
            echo "rom_sha256=$ROM_SHA256"
            echo "out_dir=$OUT_DIR"
          } >> "$GITHUB_OUTPUT"

      - name: Siapkan log build untuk diupload (jika gagal)
        if: failure()
        run: |
          if [ -f "$BUILD_LOG" ]; then
            tail -n 3000 "$BUILD_LOG" > "${BUILD_LOG}.tail"
          else
            echo "Log build tidak ditemukan di $BUILD_LOG" > "${BUILD_LOG}.tail"
          fi

      - name: Upload log build (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: axionos-${{ inputs.device }}-build-log
          path: ${{ env.BUILD_LOG }}.tail
          if-no-files-found: warn

      - name: Buat GitHub Release
        if: success()
        working-directory: ${{ env.ROM_DIR }}
        run: |
          set -e
          OUT_DIR="${{ steps.locate.outputs.out_dir }}"
          ROM_ZIP="${{ steps.locate.outputs.rom_zip }}"
          ROM_SHA256="${{ steps.locate.outputs.rom_sha256 }}"
          BUILD_TIME=$(date -u +"%Y%m%d_%H%M")
          REL_NAME="AxionOS-${DEVICE}-${{ inputs.build_type }}-${{ inputs.gms_variant }}-${BUILD_TIME}"

          ASSETS=("$ROM_ZIP")
          for img in boot.img dtbo.img vendor_boot.img vendor_kernel_boot.img; do
            [ -f "$OUT_DIR/$img" ] && ASSETS+=("$OUT_DIR/$img")
          done

          dolby_status="Tidak disertakan"
          [[ "${{ inputs.include_dolby }}" == true ]] && dolby_status="Disertakan (hardware_dolby@${{ inputs.dolby_hw_branch }}, DolbyUI@${{ inputs.dolby_ui_branch }})"
          miuicamera_status="Tidak disertakan"
          [[ "${{ inputs.include_miuicamera }}" == true ]] && miuicamera_status="Disertakan"

          cat > release_notes.md << NOTES_EOF
          #

          | | |
          |:---|:---|
          | 📱 Device | POCO F4 GT (${DEVICE}) • Redmi K50G (${DEVICE}) |
          | 🟠 ROM | AxionOS |
          | 🌿 Manifest branch | ${{ inputs.manifest_branch }} |
          | 🌿 Device/vendor/kernel branch | ${{ inputs.device_branch }} |
          | 🌿 GameKeys/Leds branch | ${{ inputs.packages_branch }} |
          | 🧩 Build type | ${{ inputs.build_type }} |
          | 🔧 Variant | ${{ inputs.gms_variant }} |
          | 💻 Root solution | ${{ inputs.ksu_type }} |
          | 🎧 Dolby | ${dolby_status} |
          | 📷 MIUI Camera HAL | ${miuicamera_status} |
          | 🧬 SoC | ${SOC} |
          | 🔐 SHA256 | \`${ROM_SHA256}\` |

          ---
          NOTES_EOF

          gh release create "$REL_NAME" --title "$REL_NAME" --notes-file release_notes.md "${ASSETS[@]}"
